<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hay Day — Guide Complet</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --sidebar-width: 300px;
  --green-dark: #2d5a27;
  --green-mid: #4a8c3f;
  --green-light: #7cbd6e;
  --green-bg: #e8f5e1;
  --brown: #8b6914;
  --gold: #d4a017;
  --yellow-bg: #fff8dc;
  --header-bg: #1a3a15;
  --text: #2c2c2c;
  --text-light: #666;
  --border: #c8e6c9;
  --shadow: rgba(0,0,0,0.1);
  --card-bg: #fff;
  --hover: #f1f8e9;
  --unknown: #ff9800;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text);
  background: var(--green-bg);
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-width);
  background: var(--header-bg);
  color: #fff;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 100;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  text-align: center;
}

.sidebar-header h1 {
  font-size: 18px;
  margin-bottom: 4px;
  color: var(--gold);
}

.sidebar-header p {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
}

.sidebar-search {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.sidebar-search input {
  width: 100%;
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  outline: none;
}

.sidebar-search input::placeholder {
  color: rgba(255,255,255,0.4);
}

.sidebar-search input:focus {
  background: rgba(255,255,255,0.25);
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.nav-section {
  padding: 0;
}

.nav-section-title {
  padding: 8px 16px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.4);
  cursor: default;
  font-weight: 600;
}

.nav-item {
  display: block;
  padding: 7px 16px 7px 24px;
  color: rgba(255,255,255,0.75);
  text-decoration: none;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 3px solid transparent;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-item:hover {
  background: rgba(255,255,255,0.08);
  color: #fff;
}

.nav-item.active {
  color: var(--gold);
  border-left-color: var(--gold);
  background: rgba(212,160,23,0.1);
}

/* Main content */
.main {
  margin-left: var(--sidebar-width);
  flex: 1;
  padding: 0;
  min-height: 100vh;
}

.page-header {
  background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
  color: #fff;
  padding: 30px 40px;
}

.page-header h2 {
  font-size: 28px;
  margin-bottom: 6px;
}

.page-header p {
  font-size: 14px;
  opacity: 0.8;
}

.content {
  padding: 24px 40px 80px;
}

/* Category cards */
.category-card {
  background: var(--card-bg);
  border-radius: 12px;
  box-shadow: 0 2px 8px var(--shadow);
  margin-bottom: 24px;
  overflow: hidden;
}

.category-header {
  background: var(--green-mid);
  color: #fff;
  padding: 14px 20px;
  font-size: 18px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

.category-header .icon {
  font-size: 24px;
}

/* Product table */
.product-table {
  width: 100%;
  border-collapse: collapse;
}

.product-table th {
  background: #f5f5f5;
  padding: 10px 16px;
  text-align: left;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  border-bottom: 2px solid var(--border);
  font-weight: 600;
}

.product-table td {
  padding: 8px 16px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 14px;
}

.product-table tr:hover {
  background: var(--hover);
}

.product-name {
  font-weight: 500;
}

.product-price {
  font-family: 'Consolas', monospace;
  color: var(--brown);
  font-weight: 600;
}

.product-time {
  font-family: 'Consolas', monospace;
  color: var(--text-light);
}

.product-time.unknown {
  color: var(--unknown);
  font-weight: 600;
}

/* Price table */
.price-table-wrapper {
  overflow-x: auto;
}

.price-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.price-table th {
  background: #f5f5f5;
  padding: 8px 10px;
  text-align: center;
  border-bottom: 2px solid var(--border);
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-light);
  font-weight: 600;
}

.price-table th:first-child {
  text-align: left;
  padding-left: 16px;
  position: sticky;
  left: 0;
  background: #f5f5f5;
  z-index: 2;
  min-width: 160px;
}

.price-table td {
  padding: 6px 10px;
  text-align: center;
  border-bottom: 1px solid #f0f0f0;
  font-family: 'Consolas', monospace;
  font-size: 13px;
}

.price-table td:first-child {
  text-align: left;
  font-family: inherit;
  padding-left: 16px;
  position: sticky;
  left: 0;
  background: var(--card-bg);
  z-index: 1;
  font-weight: 500;
}

.price-table tr:hover td {
  background: var(--hover);
}

.price-table tr:hover td:first-child {
  background: var(--hover);
}

.price-table tr:hover td:first-child {
  background: var(--hover);
}

/* Sub-group headings in prices */
.subgroup-header {
  background: var(--yellow-bg);
  padding: 10px 16px;
  font-weight: 600;
  font-size: 14px;
  color: var(--brown);
  border-bottom: 1px solid var(--border);
}

/* Multiplier table special */
.multiplier-table td:first-child {
  font-weight: 600;
  color: var(--green-dark);
}

/* Filter bar */
.filter-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.filter-bar input,
.filter-bar select {
  padding: 10px 16px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--card-bg);
  outline: none;
  transition: border-color 0.2s;
}

.filter-bar input:focus,
.filter-bar select:focus {
  border-color: var(--green-mid);
}

.filter-bar input {
  flex: 1;
  min-width: 200px;
}

.filter-bar select {
  min-width: 180px;
}

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 16px;
  padding: 12px 20px;
  background: var(--yellow-bg);
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 13px;
  color: var(--text-light);
  flex-wrap: wrap;
}

.stats-bar .stat {
  display: flex;
  align-items: center;
  gap: 4px;
}

.stats-bar .stat-value {
  font-weight: 600;
  color: var(--text);
}

/* Back to top */
.back-to-top {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 44px;
  height: 44px;
  background: var(--green-mid);
  color: #fff;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  transition: opacity 0.3s;
}

.back-to-top:hover {
  background: var(--green-dark);
}

.back-to-top.visible {
  display: flex;
}

/* View toggle */
.view-toggle {
  display: flex;
  gap: 4px;
  background: #f0f0f0;
  border-radius: 8px;
  padding: 3px;
}

.view-toggle button {
  padding: 7px 16px;
  border: none;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-light);
  transition: all 0.15s;
}

.view-toggle button.active {
  background: var(--card-bg);
  color: var(--text);
  box-shadow: 0 1px 3px var(--shadow);
  font-weight: 600;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}

.empty-state .icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.empty-state h3 {
  font-size: 18px;
  margin-bottom: 8px;
  color: var(--text);
}

/* Scrollbar */
.sidebar-nav::-webkit-scrollbar,
.sidebar::-webkit-scrollbar {
  width: 6px;
}

.sidebar-nav::-webkit-scrollbar-track,
.sidebar::-webkit-scrollbar-track {
  background: transparent;
}

.sidebar-nav::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
}

/* Section content (text sections) */
.section-content {
  font-size: 15px;
  line-height: 1.7;
}

.section-content h3 {
  font-size: 18px;
  color: var(--green-dark);
  margin: 28px 0 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--border);
}

.section-content h3:first-child {
  margin-top: 0;
}

.section-content p {
  margin-bottom: 14px;
}

.section-content ul {
  margin: 10px 0 16px;
  padding-left: 24px;
}

.section-content li {
  margin-bottom: 6px;
}

.section-content blockquote {
  background: var(--yellow-bg);
  border-left: 4px solid var(--gold);
  padding: 12px 16px;
  margin: 16px 0;
  border-radius: 0 6px 6px 0;
  font-style: italic;
}

.wiki-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0 20px;
  font-size: 13px;
}

.wiki-table th {
  background: var(--green-dark);
  color: #fff;
  padding: 8px 12px;
  text-align: left;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
  white-space: nowrap;
}

.wiki-table td {
  padding: 7px 12px;
  border-bottom: 1px solid #e0e0e0;
}

.wiki-table tr:nth-child(even) {
  background: #fafafa;
}

.wiki-table tr:hover {
  background: var(--hover);
}

.wiki-table-wrapper {
  overflow-x: auto;
  margin-bottom: 20px;
}

.animal-card {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 12px;
  border-left: 4px solid var(--green-mid);
}

.animal-card h4 {
  color: var(--green-dark);
  font-size: 16px;
  margin-bottom: 8px;
}

.animal-card ul {
  margin: 0;
  padding-left: 20px;
}

/* Home / Landing page */
.home-header {
  text-align: center;
  padding: 40px 20px 20px;
  background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
  color: #fff;
  border-radius: 16px;
  margin-bottom: 32px;
}

.home-header h1 {
  font-size: 28px;
  margin-bottom: 16px;
  color: var(--gold);
}

.home-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 24px;
  margin-bottom: 16px;
  font-size: 13px;
  opacity: 0.9;
}

.home-meta p {
  margin: 0;
}

.home-desc {
  font-size: 15px;
  opacity: 0.85;
  max-width: 600px;
  margin: 0 auto;
}

.home-toc {
  margin: 32px 0;
}

.home-toc h2 {
  text-align: center;
  margin-bottom: 24px;
  color: var(--green-dark);
}

.toc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
}

.toc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 14px;
  text-decoration: none;
  color: var(--text);
}

.toc-item:hover {
  background: var(--hover);
  border-color: var(--green-mid);
  transform: translateY(-1px);
  box-shadow: 0 2px 8px var(--shadow);
}

.toc-item span {
  font-weight: 500;
}

.home-footer {
  text-align: center;
  padding: 20px;
  margin-top: 32px;
  font-size: 12px;
  color: var(--text-light);
  border-top: 1px solid var(--border);
}

/* Responsive */
@media (max-width: 768px) {
  .sidebar {
    width: 100%;
    height: auto;
    position: relative;
    max-height: 50vh;
  }
  .main {
    margin-left: 0;
  }
  .content {
    padding: 16px;
  }
  .page-header {
    padding: 20px;
  }
  .page-header h2 {
    font-size: 22px;
  }
  .price-table th:first-child,
  .price-table td:first-child {
    position: static;
  }
}

  </style>

    app.innerHTML = html;

    document.getElementById('product-search').addEventListener('input', () => renderProducts());
    document.getElementById('product-cat').addEventListener('change', () => renderProducts());
    document.getElementById('product-sort').addEventListener('change', () => renderProducts());
  }

  function renderPrices() {
    if (!pricesData) return;

    const searchTerm = (document.getElementById('price-search')?.value || '').toLowerCase();
    const sectionFilter = document.getElementById('price-section')?.value || 'all';

    let selectedSections = [];
    if (sectionFilter === 'all') {
      selectedSections = pricesData.filter(s => s.id > 0);
    } else {
      const s = pricesData.find(s => s.id === parseInt(sectionFilter));
      if (s) selectedSections = [s];
    }

    let html = '';
    html += '<div class="page-header">';
    html += '<h2>💰 Prix de Vente par Quantité</h2>';
    html += '<p>Prix par quantité (boutique en bord de route) — coefficients multiplicateurs inclus</p>';
    html += '</div>';
    html += '<div class="content">';

    html += '<div class="filter-bar">';
    html += '<input type="text" id="price-search" placeholder="Rechercher un produit…" value="' + escapeHtml(document.getElementById('price-search')?.value || '') + '">';
    html += '<select id="price-section">';
    html += '<option value="all"' + (sectionFilter === 'all' ? ' selected' : '') + '>Toutes les sections</option>';
    pricesData.filter(s => s.id > 0).forEach(s => {
      html += '<option value="' + s.id + '"' + (sectionFilter === String(s.id) ? ' selected' : '') + '>' + s.icon + ' ' + s.name + '</option>';
    });
    html += '</select>';
    html += '</div>';

    const renderTable = (rows, headers) => {
      const filtered = searchTerm ? rows.filter(r => r.name.toLowerCase().includes(searchTerm)) : rows;
      if (filtered.length === 0) return '';

      let t = '<div class="price-table-wrapper"><table class="price-table">';
      t += '<thead><tr>';
      if (headers) {
        headers.forEach(h => { t += '<th>' + escapeHtml(h) + '</th>'; });
      } else {
        t += '<th>Produit</th>';
        for (let i = 1; i <= 10; i++) t += '<th>' + i + '</th>';
      }
      t += '</tr></thead><tbody>';
      filtered.forEach(r => {
        t += '<tr><td>' + escapeHtml(r.name) + '</td>';
        r.prices.forEach(pr => { t += '<td>' + pr + '</td>'; });
        t += '</tr>';
      });
      t += '</tbody></table></div>';
      return t;
    };

    let anyVisible = false;
    selectedSections.forEach(sec => {
      if (sec.subGroups) {
        sec.subGroups.forEach(sg => {
          const tableHtml = renderTable(sg.rows, sec.headers);
          if (tableHtml) {
            html += '<div class="category-card"><div class="subgroup-header">' + escapeHtml(sg.name) + '</div>' + tableHtml + '</div>';
            anyVisible = true;
          }
        });
      } else {
        const tableHtml = renderTable(sec.rows, sec.headers);
        if (tableHtml) {
          html += '<div class="category-card"><div class="category-header"><span class="icon">' + sec.icon + '</span>' + escapeHtml(sec.name) + '</div>' + tableHtml + '</div>';
          anyVisible = true;
        }
      }
    });

    if (!anyVisible && searchTerm) {
      html += '<div class="empty-state"><div class="icon">🔍</div><h3>Aucun résultat</h3><p>Essayez de modifier votre recherche.</p></div>';
    }

    html += '</div>';
    app.innerHTML = html;

    const si = document.getElementById('price-search');
    if (si) si.addEventListener('input', () => renderPrices());
    const ps = document.getElementById('price-section');
    if (ps) ps.addEventListener('change', () => renderPrices());
  }

  function updateBackToTop() {
    window.removeEventListener('scroll', updateBackToTop._handler);
    updateBackToTop._handler = () => {
      backToTop.classList.toggle('visible', window.scrollY > 400);
    };
    window.addEventListener('scroll', updateBackToTop._handler);
    backToTop.classList.toggle('visible', window.scrollY > 400);
  }

  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  renderNav();
  navigateTo(0);

})();

  </script>
</body>
</html>
